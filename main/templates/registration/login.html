{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — RepairWorkshop</title>
 
    <style>
        * {
            box-sizing: border-box;
        }
 
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
 
        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
 
        h1 {
            text-align: center;
            margin-bottom: 10px;
        }
 
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }
 
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
 
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }
 
        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
 
        button:hover {
            background: #1d4ed8;
        }
 
        .error {
            color: #dc2626;
            margin-bottom: 15px;
        }
 
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
    <link rel="stylesheet" href="{% static 'main/css/fixpoint.css' %}">
</head>
 
<body>
 
<div class="login-container">
 
    <h1>Вход</h1>
    <p class="subtitle">RepairWorkshop</p>
 
    {% if form.errors %}
        <p class="error">
            Неверный логин или пароль. Попробуйте ещё раз.
        </p>
    {% endif %}
 
    <form method="post">
        {% csrf_token %}
 
        <label for="id_username">Логин</label>
        <input
            type="text"
            name="username"
            id="id_username"
            required
            autofocus
        >
 
        <label for="id_password">Пароль</label>
        <input
            type="password"
            name="password"
            id="id_password"
            required
        >
 
        <button type="submit">Войти</button>
    </form>
 
    <a href="/" class="back-link">Вернуться на главную</a>
 
</div>
 
</body>
</html>
