<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Новый сотрудник</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f1f5f9;font:16px Arial;color:#1e293b}.card{max-width:650px;margin:auto;background:white;border-radius:14px;padding:24px}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 12px}button,a{display:inline-block;padding:11px 15px;border:0;border-radius:8px;background:#2563eb;color:white;text-decoration:none;cursor:pointer}.helptext{display:block;color:#64748b;font-size:13px}.errorlist{color:#b91c1c}@media(max-width:600px){body{padding:12px}.card{padding:16px}}</style>    <link rel="stylesheet" href="{% static 'main/css/fixpoint.css' %}">
</head><body><main class="card"><h1>Добавление сотрудника</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Создать сотрудника</button> <a href="{% url 'employee_list' %}">Отмена</a></form></main></body></html>
