{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка отправлена</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .message {
            max-width: 500px;
            margin: 20px;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 16px;
        }

        h1 {
            color: #16a34a;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
    <link rel="stylesheet" href="{% static 'main/css/fixpoint.css' %}">
</head>

<body>
    <div class="message">
        <h1>Заявка отправлена!</h1>

        <p>
            Спасибо за обращение.
            Мы получили вашу заявку и скоро свяжемся с вами.
        </p>

        <a href="/">Вернуться на главную</a>
    </div>
</body>
</html>
